name: Repo Aquarium

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  group: repo-aquarium
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: JongHyun070105/repo-aquarium@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          themes: coral-day,deep-ocean,github-dark,sunset-lagoon,arctic-ice,neon-cyber
          creatures: fish,jellyfish,crab,turtle,seahorse,octopus,ray,pufferfish,starfish
          ci-workflow: test.yml
